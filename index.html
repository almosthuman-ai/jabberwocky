    <style>
      /* Custom print styles to ensure A4 rendering */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }
        
        /* Reset all structural constraints */
        html, body, #root, #app-container, #main-area, #scroll-area {
          height: auto !important;
          overflow: visible !important;
          background: white !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          display: block !important;
          position: static !important;
        }

        /* Hide generic UI elements */
        .no-print, button, .toolbar, .sidebar {
          display: none !important;
        }

        /* Reset the scale transform wrapper inside scroll-area */
        #scroll-area > div {
           transform: none !important;
           padding: 0 !important;
        }

        /* Ensure the preview container renders normally */
        #preview-content {
            width: 100% !important;
            margin: 0 !important;
            position: static !important;
        }

        /* Page specific styles */
        .a4-page {
          margin: 0 !important;
          box-shadow: none !important;
          page-break-after: always;
          width: 210mm !important;
          height: 297mm !important;
          overflow: hidden !important;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
          border: none !important;
        }
        
        .a4-page:last-child {
          page-break-after: auto;
        }
      }
      
      .a4-page {
        width: 210mm;
        height: 297mm;
        background: white;
        margin: 0 auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        padding: 10mm 15mm;
        position: relative;
        overflow: hidden;
      }
      
      body {
        font-family: 'Inter', sans-serif;
      }
      
      .serif-font {
        font-family: 'Noto Serif TC', serif;
      }
      
      .sans-font {
        font-family: 'Noto Sans TC', sans-serif;
      }
    </style>
